# Contradiction register — competing accounts preserved, not laundered.
# disagreement_kind: fact | chronology | interpretation | motive | credit | outcome
contradictions:
  - id: hydra-worker-x1
    disputed_claim: How many endpoints does HYDRA have?
    disagreement_kind: fact
    claim_ids: [hw-c09, hw-c05, hw-c06]
    accounts:
      - source_ids: [src-git-hydra-worker]
        date: 2026-03-26
        proximity: contemporaneous code
        says: "src/index.js registers 26 routes (24 utilities plus / and /health); the / banner hard-codes endpoints 20."
      - source_ids: [src-git-hydra-worker, src-gh-metadata]
        date: 2026-04-03
        proximity: contemporaneous documentation
        says: "README title, badge and GitHub description say 22; the README's own 'All 22 Endpoints' table has 24 rows; openapi.json says '20+' and lists 26 paths; the playground says 22 and wires 17."
      - source_ids: [src-tc-registry-hydra]
        date: 2026-08-03
        proximity: agent measurement, four months later
        says: "'openapi.json paths = 25 entries (and it omits /time/convert/:ts)' — which is wrong against the committed file (26 paths, including /time/convert/{timestamp})."
    best_supported_reading: 24 utility routes plus two meta routes; every published number is an unreconciled approximation, and one later audit added an error of its own.
    confidence: confirmed
    resolving_evidence: none needed; a README/banner/openapi reconciliation would close it.
  - id: hydra-worker-x2
    disputed_claim: Was HYDRA live in July 2026?
    disagreement_kind: fact
    claim_ids: [hw-c08, hw-c13]
    accounts:
      - source_ids: [src-tc-root-reports-2026-07]
        date: 2026-07-20
        proximity: owner-side planning
        says: "'hydra-worker — LIVE — verify only (all confirmed 200)'."
      - source_ids: [src-tc-root-reports-2026-07]
        date: 2026-07-22
        proximity: owner-side research note, two days later
        says: "'hydra is NOT actually live (static backup repo, no deploy pipeline, its own registry says not deployed?)'."
      - source_ids: [src-live-probe, src-tc-registry-hydra, src-tc-audit-2026-08]
        date: 2026-08-03
        proximity: measurement
        says: HTTP 200 with Cloudflare headers on 2026-07-20, 2026-08-03, 2026-08-06 and 2026-09-04.
    best_supported_reading: Live throughout; the 2026-07-22 note examined hydra-site (a static file) and the May manifest (url null), not the Worker.
    confidence: confirmed
    resolving_evidence: none needed; the consolidation of 2026-07-25 removed the ambiguity that caused it.
  - id: hydra-worker-x3
    disputed_claim: Is the Python/FastAPI repository this Worker's predecessor or a parallel variant?
    disagreement_kind: chronology
    claim_ids: [hw-c02, hw-c05, hw-c21]
    accounts:
      - source_ids: [src-git-hydra-api, src-git-hydra-worker]
        date: 2026-03-26
        proximity: contemporaneous machine record
        says: The FastAPI root commit precedes this root by 75 minutes; this code is a route-for-route port; the banner links its docs back there.
      - source_ids: [src-git-hydra-worker, src-tc-master-portfolio]
        date: 2026-04-03
        proximity: author, eight days after the event; owner portfolio in June
        says: "'Also Available: Python/FastAPI version'; 'a parallel Python/FastAPI variant for a possible RapidAPI listing'."
      - source_ids: [src-tc-registry-hydra]
        date: 2026-08-03
        proximity: agent-written, four months later
        says: "'earlier Python/FastAPI predecessor … never deployed … Superseded/shelved'."
    best_supported_reading: Chronologically the predecessor and functionally the source; strategically framed as a sibling; by outcome, shelved. All three are true of different things.
    confidence: strongly_supported
    resolving_evidence: The authoring session of 2026-03-26 or an owner statement about why two implementations were made the same night.
  - id: hydra-worker-x4
    disputed_claim: Is this a revenue asset?
    disagreement_kind: interpretation
    claim_ids: [hw-c10, hw-c12, hw-c22, hw-c23]
    accounts:
      - source_ids: [src-tc-meta-inventory-2026-05, src-git-hydra-worker]
        date: 2026-05-05
        proximity: owner tooling; committed 2026-09-01
        says: ".toledo.yaml: type revenue."
      - source_ids: [src-business-ops, src-marketing-arm]
        date: 2026-06-17
        proximity: owner strategy documents
        says: "'PILOT-READY — RapidAPI freemium/metered' (business-ops) versus 'fails G1: no price set … a business-model decision, not a one-click fix' (marketing gate) versus 'price it like a template, not a product' (asset kit)."
      - source_ids: [src-git-hydra-worker, src-tc-audit-2026-08]
        date: 2026-08-06
        proximity: code and measurement
        says: No auth, no rate limit, no billing anywhere in code; "aspirational, not real revenue".
    best_supported_reading: A free reference implementation carrying a revenue label that no document has turned into a price; the strategy documents disagree only about how to describe the gap.
    confidence: confirmed
    resolving_evidence: A decided price or a recorded decision to designate HYDRA a lead/backlink asset.
  - id: hydra-worker-x5
