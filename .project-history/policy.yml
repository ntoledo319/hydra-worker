# Project-history policy — HYDRA Developer Toolkit (active/hydra-worker)
# Parsed by scripts/project_history.mjs (strict YAML subset: block maps/lists, flow lists of scalars,
# quoted strings, | and > block scalars). Keep it that simple.

repository: ntoledo319/hydra-worker
project: HYDRA Developer Toolkit (hydra-worker)
local_path: /home/nick/Development/active/hydra-worker
default_branch: master
docs_dir: docs/history
history_dir: .project-history
commands:
  assess: node scripts/project_history.mjs assess
  context: node scripts/project_history.mjs context
  validate: node scripts/project_history.mjs validate
  render: node scripts/project_history.mjs render
  audit_full: node scripts/project_history.mjs audit --full
  audit_incremental: node scripts/project_history.mjs audit --since HEAD~1
  test: node --test test/project_history_tests.mjs

# Order in which docs/history chapters are assembled into PROJECT_HISTORY.md.
render_order: [ORIENTATION.md, NARRATIVE.md, IDEOLOGY.md, GOALS.md, DECISION_MAP.md, TIMELINE.md, OPEN_QUESTIONS.md]

# Materiality: record an event when purpose, audience, promise, principle, success metric, goal or
# non-goal changes; when a durable interface/architecture/security/deployment/licence choice constrains
# future work; on a meaningful release, migration, deprecation, incident, rollback or reversal; when an
# experiment or discovery changes what the project believes; when a feature or removal changes identity.
# Typos, formatting, generated refreshes, lockfile churn, fixups and behaviour-preserving refactors are noise.
materiality:
  material_paths:
    - glob: src/index.js
      why: the entire API surface, its banner (endpoint count, docs link) and every handler live in this one file
    - glob: openapi.json
      why: the published contract; the family's endpoint-count contradiction lives partly here
    - glob: docs/index.html
      why: the public playground served by GitHub Pages and mirrored (byte-identically) by the archived hydra-site
    - glob: docs/SOURCE-OF-TRUTH.md
      why: the consolidation boundary that made this repository canonical
    - glob: wrangler.jsonc
      why: runtime, compatibility date, bindings and deployment shape are durable operating-model choices
    - glob: package.json
      why: dependency posture ("zero dependencies beyond Hono") is a stated principle
    - glob: README.md
      why: the public promise (count, price, licence, live URL, "Also Available") is stated here
    - glob: LICENSE
      why: licence terms are governance (MIT claimed 2026-04-03, file added 2026-09-01)
    - glob: .toledo.yaml
      why: lifecycle status, revenue classification and canonical notes are portfolio governance
    - glob: test/index.spec.js
      why: the only product test; currently the untouched starter template
    - glob: vitest.config.js
      why: test harness configuration
    - glob: .github/workflows/**
      why: CI/automation changes the operating model
  noise_paths:
    - docs/history/**
    - .project-history/**
    - PROJECT_HISTORY.md
    - AGENTS.md
    - scripts/project_history.mjs
    - test/project_history_tests.mjs
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/workflows/project-history.yml
    - package-lock.json
    - .editorconfig
    - .prettierrc
    - .vscode/**
    - .gitignore
  history_only_commit_patterns:
    - "^history:"
    - "^chore\\(history\\)"
    - "\\[history-only\\]"

cadence:
  incremental_review: on every pull request (CI) and before any `wrangler deploy` (deployment is an explicit decision, per docs/SOURCE-OF-TRUTH.md)
  gardener: monthly scheduled audit --full with a drift report

# Deferrals: `history:defer` must be attributable and must expire. Each entry needs id, owner,
# deadline (YYYY-MM-DD), tracking and status (open|closed). validate fails on expired open deferrals.
deferrals: []

# Repository identity facts the tool does not need but agents do.
identity:
  live_url: https://hydra-worker.toledonick98.workers.dev
  playground_url: https://ntoledo319.github.io/hydra-worker/
  deploy_mechanism: manual `wrangler deploy` from a developer machine; no CI/CD; no custom domain
  sibling_python_reference: /home/nick/Development/backburner/hydra-api
  retired_static_mirror: /home/nick/Development/archive/duplicates/hydra-site
  thematic_predecessor: "/home/nick/Development/archive/NoHustle API"
